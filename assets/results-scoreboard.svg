<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Condiments paired live evaluation scoreboard</title>
  <desc id="desc">Zero-token memory saved 32.2 percent total tokens with eight of eight quality checks. Progressive skill disclosure saved 5.1 percent with eight of eight checks. Prompt-only tool state was rejected after passing two of eight candidate checks.</desc>
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="984" height="544" rx="28" fill="#fff9e9" stroke="#201d19" stroke-width="4"/>
  <g font-family="Trebuchet MS, Arial, sans-serif" fill="#201d19">
    <text x="48" y="65" font-size="32" font-weight="800">THE TOKEN TASTE TEST</text>
    <text x="48" y="96" font-size="16" font-weight="700" fill="#6d6257">paired live • gpt-5.6-luna • same tasks • 8 pairs each</text>

    <g transform="translate(48 130)">
      <text x="0" y="22" font-size="18" font-weight="800">TOTAL TOKEN SAVINGS</text>
      <line x1="330" y1="40" x2="900" y2="40" stroke="#cfc5b6" stroke-width="2"/>
      <g font-size="13" font-weight="700" fill="#786e62">
        <text x="325" y="25">0%</text><text x="463" y="25">10%</text><text x="606" y="25">20%</text><text x="748" y="25">30%</text><text x="887" y="25">40%</text>
      </g>
      <g stroke="#ded6ca" stroke-width="1">
        <line x1="330" y1="40" x2="330" y2="270"/><line x1="472.5" y1="40" x2="472.5" y2="270"/><line x1="615" y1="40" x2="615" y2="270"/><line x1="757.5" y1="40" x2="757.5" y2="270"/><line x1="900" y1="40" x2="900" y2="270"/>
      </g>

      <circle cx="24" cy="88" r="21" fill="#e7352d" stroke="#201d19" stroke-width="3"/>
      <path d="M18 78h12M24 72v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="84" font-size="18" font-weight="800">ZERO-TOKEN MEMORY</text>
      <text x="56" y="105" font-size="14" font-weight="700" fill="#6d6257">exact recall • 8/8 quality</text>
      <rect x="330" y="68" width="459" height="42" rx="12" fill="#e7352d" filter="url(#sketch)"/>
      <text x="802" y="97" font-size="23" font-weight="800" fill="#c6251e">32.2% LESS</text>

      <circle cx="24" cy="170" r="21" fill="#f5c518" stroke="#201d19" stroke-width="3"/>
      <path d="M15 171l7 7 13-16" fill="none" stroke="#201d19" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="166" font-size="18" font-weight="800">SKILL SLICING</text>
      <text x="56" y="187" font-size="14" font-weight="700" fill="#6d6257">load only what is active • 8/8</text>
      <rect x="330" y="150" width="73" height="42" rx="12" fill="#f5c518" filter="url(#sketch)"/>
      <text x="418" y="179" font-size="23" font-weight="800" fill="#9b7300">5.1% LESS</text>

      <circle cx="24" cy="252" r="21" fill="#b8d995" stroke="#201d19" stroke-width="3"/>
      <path d="M15 243l18 18M33 243l-18 18" stroke="#201d19" stroke-width="4" stroke-linecap="round"/>
      <text x="56" y="248" font-size="18" font-weight="800">PROMPT-ONLY TOOL STATE</text>
      <text x="56" y="269" font-size="14" font-weight="700" fill="#6d6257">model reran tools • only 2/8 passed</text>
      <rect x="330" y="232" width="570" height="42" rx="12" fill="#e7e1d8"/>
      <path d="M340 253h450" stroke="#9c9185" stroke-width="5" stroke-dasharray="12 10"/>
      <rect x="795" y="229" width="105" height="48" rx="14" fill="#ff5a2e" stroke="#201d19" stroke-width="3" transform="rotate(-2 847 253)"/>
      <text x="816" y="260" font-size="19" font-weight="800" fill="#fff">REJECT</text>
    </g>

    <g transform="translate(48 454)">
      <rect x="0" y="0" width="904" height="65" rx="18" fill="#dff1c8" stroke="#201d19" stroke-width="3"/>
      <text x="24" y="28" font-size="17" font-weight="800">HOUSE RULE:</text>
      <text x="150" y="28" font-size="17" font-weight="700">If quality drops, the bottle goes back on the shelf.</text>
      <text x="24" y="51" font-size="13" font-weight="700" fill="#5f684f">These are measured workload results—not a promise for every model or task.</text>
    </g>
  </g>
</svg>
